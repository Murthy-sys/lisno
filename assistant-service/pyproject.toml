[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lisno-assistant-service"
version = "0.1.0"
description = "Private, stateless Lisno assistant planning service"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.1", "starlette==1.8.0", "pydantic==2.13.5", "httpx==0.28.1", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
lisno-assistant = "lisno_assistant.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lisno_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["model: opt-in independent-server model evaluation"]
