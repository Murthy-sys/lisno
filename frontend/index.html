<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17213f" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles/brand-loader.css" />
    <link rel="preload" href="/src/assets/lisno-loader.svg" as="image" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Fraunces:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Lisno</title>
  </head>
  <body>
    <div id="root">
      <div class="lisno-startup-loader" role="status" aria-label="Page loading">
        <span class="lisno-loading-mark" aria-hidden="true">
          <img class="lisno-loading-mark__logo" src="/src/assets/lisno-loader.svg" width="72" height="72" alt="" />
        </span>
        <p class="lisno-loading-message">Loading Lisno…</p>
        <noscript><p>Enable JavaScript to open Lisno.</p></noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
