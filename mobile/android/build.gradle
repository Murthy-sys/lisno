// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// React's root plugin evaluates :app immediately, so install these hooks first.
apply from: '../scripts/lisno-build-environment.gradle'

subprojects { subproject ->
  if (subproject.name == 'expo-constants') {
    subproject.tasks.withType(Exec).configureEach { task ->
      if (task.name == 'createExpoConfig') {
        rootProject.ext.lisnoBuildEnvironment.configureMetadata(task)
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
