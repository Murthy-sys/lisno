*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;font-family:'Roboto',system-ui,sans-serif;font-size:13px;background:#F4F3FB;color:#1E1B3A}
button,input,select,textarea{font-family:inherit;font-size:12px}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#C4C1E8;border-radius:4px}
/* Layout */
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:196px;flex-shrink:0;background:#1E1B3A;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.06)}
.sb-logo{padding:14px 14px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo img{height:28px;object-fit:contain}
.sb-role{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.35);margin-top:4px}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0}
.sb-section{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.25);padding:12px 14px 4px}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;transition:background .12s;color:rgba(255,255,255,.6);font-size:11px;font-weight:400;position:relative}
.sb-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.9)}
.sb-item.active{background:rgba(91,88,160,.35);color:#fff;font-weight:600}
.sb-item.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:#8B88D0;border-radius:0 3px 3px 0}
.sb-badge{margin-left:auto;background:#EF4444;color:#fff;font-size:8px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.sb-badge.yellow{background:#EAB308}
.sb-footer{padding:10px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:9px;color:rgba(255,255,255,.25)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;height:50px;display:flex;align-items:center;padding:0 20px;gap:12px;border-bottom:1px solid #DDDCF0;flex-shrink:0}
.topbar-title{font-family:'Georgia',serif;font-size:17px;font-weight:600;color:#1E1B3A;flex:1}
.body{display:flex;flex:1;overflow:hidden}
/* Login */
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1E1B3A,#2E2B5A 60%,#1E1B3A)}
.login-card{background:#fff;border-radius:14px;padding:32px 28px;width:360px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.login-card h2{font-family:'Georgia',serif;font-size:22px;color:#1E1B3A;margin-bottom:4px;text-align:center}
.login-card p{font-size:11px;color:#9CA3AF;text-align:center;margin-bottom:20px}
.lf{margin-bottom:12px}
.ll{display:block;font-size:10px;font-weight:700;color:#6B68A0;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.li{width:100%;padding:9px 11px;border:1.5px solid #DDDCF0;border-radius:8px;font-size:12px;outline:none;transition:border-color .15s}
.li:focus{border-color:#5B58A0}
.lb{width:100%;padding:10px;background:#1E1B3A;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-top:4px}
.lb:hover{background:#2E2B5A}
.lerr{background:#FEF2F2;color:#B91C1C;border:1px solid rgba(185,28,28,.2);border-radius:7px;padding:8px 11px;font-size:11px;margin-bottom:12px}
.quick-login{margin-top:16px;border-top:1px solid #F4F3FB;padding-top:14px}
.ql-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#9CA3AF;margin-bottom:8px}
.ql-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.ql-btn{padding:6px 4px;background:#F4F3FB;border:1px solid #DDDCF0;border-radius:7px;cursor:pointer;text-align:center;transition:all .12s}
.ql-btn:hover{background:#EEEDF8;border-color:#C4C1E8}
.ql-name{font-size:9px;font-weight:700;color:#1E1B3A;display:block}
.ql-role{font-size:8px;color:#9CA3AF;display:block}
/* Cards */
.card{background:#fff;border:1px solid #DDDCF0;border-radius:11px;overflow:hidden}
.card-hdr{padding:11px 16px;border-bottom:1px solid #DDDCF0;display:flex;align-items:center;gap:8px}
/* Lead cards */
.lead-card{background:#fff;border:1px solid #DDDCF0;border-radius:10px;padding:11px 14px;cursor:pointer;transition:all .12s;margin-bottom:7px}
.lead-card:hover{border-color:#C4C1E8;box-shadow:0 2px 10px rgba(91,88,160,.1)}
.stage-chip{font-size:8px;font-weight:700;padding:2px 7px;border-radius:5px;display:inline-block}
/* Lead detail tabs */
.ld-tabs{display:flex;border-bottom:1px solid #DDDCF0;background:#FAFAFE;flex-shrink:0}
.ld-tab{padding:10px 14px;border:none;background:transparent;cursor:pointer;font-size:10px;font-weight:400;color:#9CA3AF;border-bottom:2px solid transparent;transition:all .12s;white-space:nowrap;font-family:inherit}
.ld-tab.on{color:#5B58A0;font-weight:700;border-bottom-color:#5B58A0}
/* Pipeline */
.pipe-stage{padding:5px 10px;border-radius:6px;cursor:pointer;font-size:9px;font-weight:600;transition:all .12s}
/* Procurement */
.pkg-card{background:#fff;border:1.5px solid #DDDCF0;border-radius:10px;cursor:pointer;overflow:hidden;transition:all .15s}
.pkg-card:hover{box-shadow:0 4px 14px rgba(91,88,160,.15)}
/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(30,27,58,.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(30,27,58,.4);display:flex;flex-direction:column;max-height:92vh;overflow:hidden}
.modal-hdr{padding:14px 20px;background:linear-gradient(135deg,#1E1B3A,#5B58A0);border-radius:14px 14px 0 0;flex-shrink:0;display:flex;align-items:center;gap:12px}
.modal-hdr h3{font-family:'Georgia',serif;font-size:15px;font-weight:600;color:#fff;flex:1}
.modal-close{padding:4px 10px;border:1px solid rgba(255,255,255,.25);border-radius:7px;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;font-size:11px;font-family:inherit}
.modal-body{flex:1;overflow:auto;padding:16px 20px}
.modal-footer{padding:12px 20px;border-top:1px solid #DDDCF0;background:#FAFAFE;display:flex;gap:8px;align-items:center;flex-shrink:0}
/* Buttons */
.btn{padding:7px 16px;border:none;border-radius:7px;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;transition:all .12s}
.btn-primary{background:#1E1B3A;color:#fff}.btn-primary:hover{background:#2E2B5A}
.btn-green{background:#22C55E;color:#fff}
.btn-red{background:#EF4444;color:#fff}
.btn-ghost{background:transparent;border:1.5px solid #DDDCF0;color:#6B68A0}
/* Inputs */
.inp{width:100%;padding:7px 10px;border:1.5px solid #DDDCF0;border-radius:7px;font-size:11px;outline:none;font-family:inherit}
.inp:focus{border-color:#5B58A0}
.lbl{display:block;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#6B68A0;margin-bottom:3px}
/* Tags & badges */
.badge{font-size:8px;padding:2px 7px;border-radius:5px;font-weight:700;display:inline-block}
/* KPI bars */
.kpi-bar-wrap{height:6px;background:#EEEDF8;border-radius:6px;overflow:hidden;flex:1}
.kpi-bar{height:100%;border-radius:6px;transition:width .4s}
/* Tabs generic */
.tab-bar{display:flex;border-bottom:1px solid #DDDCF0;background:#FAFAFE;flex-shrink:0}
.tab-btn{flex:1;padding:9px 6px;border:none;border-bottom:2px solid transparent;background:transparent;cursor:pointer;font-size:9px;font-weight:400;color:#9CA3AF;font-family:inherit;transition:all .12s;white-space:nowrap}
.tab-btn.on{color:#5B58A0;font-weight:700;border-bottom-color:#5B58A0}
/* Scrollable area */
.scroll{flex:1;overflow:auto}
/* Urgency colors */
.urgent-red{color:#B91C1C;background:rgba(185,28,28,.06);border:1px solid rgba(185,28,28,.2)}
.urgent-amber{color:#A16207;background:rgba(234,179,8,.06);border:1px solid rgba(234,179,8,.2)}
.urgent-green{color:#15803D;background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.2)}

function pmRag(d){
  if(!d)return{c:GY,l:'\u25cf Unknown',bg:'rgba(156,163,175,.07)',k:'gray'};
  if(d.alerts.some(function(a){return a.c===RED;})||d.kpi.total<60)return{c:RED,l:'\u25cf Critical',bg:'rgba(239,68,68,.07)',k:'red'};
  if(d.alerts.length>0||d.kpi.total<80)return{c:ORG,l:'\u25cf At Risk',bg:'rgba(249,115,22,.07)',k:'orange'};
  if(d.stage==='initial')return{c:YLW,l:'\u25cf Setup',bg:'rgba(234,179,8,.07)',k:'yellow'};
  return{c:GRN,l:'\u25cf On Track',bg:'rgba(34,197,94,.07)',k:'green'};
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function fnFmt(v){
  if(v==null||isNaN(v))return '—';
  var abs=Math.abs(v);
  var s=v<0?'-':'';
  if(abs>=1e7) return s+'\u20b9'+(abs/1e7).toFixed(2)+'Cr';
  if(abs>=1e5) return s+'\u20b9'+(abs/1e5).toFixed(1)+'L';
  if(abs>=1e3) return s+'\u20b9'+(abs/1e3).toFixed(0)+'K';
  return s+'\u20b9'+abs;
}
function fnFmtFull(v){
  if(v==null||isNaN(v))return '—';
  return (v<0?'-':'')+'\u20b9'+Math.abs(Math.round(v)).toLocaleString('en-IN');
}
function fnPct(n,d){return d>0?Math.round(n/d*100):0;}

  bg=bg||'#EEEDF8';h=h||6;pct=Math.min(100,Math.max(0,pct));

// ── OVERHEAD TICKER ──────────────────────────────────────────────────────────
// Shows how much overhead has "burned" since midnight today
function overheadTicker(){
  var now=new Date();var midnight=new Date(now);midnight.setHours(0,0,0,0);
  var elapsed=(now-midnight)/3600000; // hours elapsed today
  var workingHours=10; // 9am-7pm
  var pct=Math.min(1,Math.max(0,(elapsed-9)/workingHours));
  var burned=Math.round(FIN_DATA.dailyOverhead*pct);
  var remaining=FIN_DATA.dailyOverhead-burned;
  var isWorking=elapsed>=9&&elapsed<=19;
  return {burned:burned,remaining:remaining,pct:Math.round(pct*100),isWorking:isWorking};
}

  // Mini KPIs in header
  h+='<div style="display:flex;gap:14px">';
  [{l:'Cash Reserve',v:fnFmt(FIN_DATA.cashReserve),sub:fnFmt(Math.abs(FIN_DATA.cashReserveChange))+(FIN_DATA.cashReserveChange>=0?' \u2191':' \u2193'),c:FIN_DATA.cashReserveChange>=0?'#86EFAC':'#FCA5A5'},
   {l:'FCF Today',v:fnFmt(FIN_DATA.freeCashFlowToday),sub:'rev \u2212 cost \u2212 oh',c:FIN_DATA.freeCashFlowToday>=0?'#86EFAC':'#FCA5A5'},
   {l:'OH Burned',v:fnFmt(overheadTicker().burned),sub:overheadTicker().pct+'% of '+fnFmt(FIN_DATA.dailyOverhead),c:'#FCD34D'},
  ].forEach(function(k){
    h+='<div style="text-align:right"><div style="font-family:Georgia,serif;font-size:14px;font-weight:700;color:'+k.c+'">'+k.v+'</div><div style="font-size:7px;color:rgba(255,255,255,.5)">'+k.l+'</div><div style="font-size:7px;color:'+k.c+'">'+k.sub+'</div></div>';
  });
  h+='</div></div>';
  // Date range bar
  h+=fnDateBar();
  // Tab bar
  h+='<div style="display:flex;overflow-x:auto;background:#F4F3FB;border-bottom:2px solid #DDDCF0;flex-shrink:0;scrollbar-width:none">';
  FN_TABS2.forEach(function(tab){var active=FN_S.tab===tab.id;h+='<button onclick="window.__FN_S.tab=\''+tab.id+'\';window.__fnRender()" style="padding:7px 12px;border:none;border-bottom:2px solid '+(active?PUR:'transparent')+';background:transparent;color:'+(active?PUR:GY)+';font-family:Roboto,sans-serif;font-size:9px;cursor:pointer;white-space:nowrap;font-weight:'+(active?700:400)+';flex-shrink:0">'+tab.l+'</button>';});
  h+='</div>';
  // Content
  h+='<div style="flex:1;overflow:hidden">';
  if(FN_S.tab==='overview')h+=fnOverview(filtered);
  else if(FN_S.tab==='collection')h+=fnCollection();
  else if(FN_S.tab==='projects')h+=fnProjects();
  else if(FN_S.tab==='centres')h+=fnCentres();
  else if(FN_S.tab==='daily')h+=fnDaily(filtered);
  else if(FN_S.tab==='payables')h+=fnPayables();
  h+='</div></div>';
  return h;
}

function fnRender2(){
  var el=document.getElementById('__fn_root');if(!el)return;
  el.innerHTML=fnBuild2();
}
window.__FN_S=FN_S;
window.__fnRender=fnRender2;
window.__fnFill=function(el){el.id='__fn_root';el.style.cssText='flex:1;overflow:hidden;display:flex;flex-direction:column;';fnRender2();};


// ── AI BUTTON (shared) ──────────────────────────────────────────────────────
function initAI(){
  if(document.getElementById('lisno-ai-btn'))return;
  var btn=document.createElement('div');
  btn.id='lisno-ai-btn';
  btn.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9996;background:linear-gradient(135deg,#1E1B3A,#5B58A0);color:#fff;border-radius:20px;padding:8px 18px 8px 12px;cursor:pointer;box-shadow:0 4px 24px rgba(91,88,160,.5);display:flex;align-items:center;gap:8px;font-family:Roboto,sans-serif;font-size:11px;font-weight:700;user-select:none';
  btn.innerHTML='<span style="font-size:18px">\u2726</span><span>Lisno AI</span>';
  document.body.appendChild(btn);
  btn.onclick=function(){alert('Lisno AI: Ask about projects, finance, or risks.\n(Full AI panel available in browser)');}; 
}

// ── INIT ────────────────────────────────────────────────────────────────────
var _started=false;
function tryStart(){
  var r=window.__lisnoRole||'';
  if(!r){setTimeout(tryStart,300);return;}
  if(!_started){_started=true;initAI();}
}
setTimeout(tryStart,300);
})();
</script>
